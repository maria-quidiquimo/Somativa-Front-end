<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 🐾 Site de ONG de adoção de animais </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./src/css/style.css">
</head>
<body>
    <header>
        
    </header>
    <main class="container my-5">
        <h2 class="text-center mb-4">Nossos Pets</h2>
        <section id="home" class="row g-3">
        </section>

        <hr class="my-5">
    </main>
    <div class="modal fade" id="modalCachorro" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-indigo text-white">
            <h5 class="modal-title" id="modalNome">Nome do Pet</h5>
            <button type="button" class="btn-close btn-close-white"
                    data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p id="modalRaca" class="text-muted"></p>
            <p id="modalDisponivel" class="fs-4 fw-bold text-success"></p>
          </div>
          <div class="modal-footer">
            <button id="btnAdotar" class="btn btn-roxo w-100">Adotar Agora</button>
          </div>
        </div>
      </div>
    </div>
    <footer>

    </footer>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/js/script.js"></script>
</body>
</html>
